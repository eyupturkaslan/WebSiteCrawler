<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block head %}{% endblock %}
<title>{% block title %}Site Denetçisi{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('crawls.dashboard') }}">Site Denetçisi</a>
  {% if g.user %}
  <nav>
    <a href="{{ url_for('crawls.dashboard') }}">Taramalar</a>
    <a href="{{ url_for('auth.account') }}">Hesabım ({{ g.user.username }})</a>
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link">Çıkış</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
